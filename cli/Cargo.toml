[package]
# Not published to crates.io — bump + tag only. The name `forge` belongs to a
# third party there (gakonst, 5.5k downloads), so publishing would auto-rename
# to `pleme-io-forge`, permanently forking this tool's public identity from its
# repo name. It buys nothing: forge is a CLI delivered via nix (`nix run`) and
# its own image/binary releases, and nothing imports it as a library.
#
# This is a DECISION, not an oversight — hence declared rather than left to the
# publish step's rename fallback, which would otherwise mint pleme-io-forge on
# the next release now that the repo is public. AUTO-RELEASE still bumps the
# version and tags every merge (proven: v0.1.1 via crate-path); only the
# registry push is off.
publish = false
name = "forge"
version = "0.1.1"
edition = "2021"
authors = ["Pleme Team <team@pleme.io>"]
description = "Deployment orchestrator for service infrastructure"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Kubernetes client
kube = { version = "0.95", features = [
  "runtime",
  "client",
  "derive",
  "rustls-tls",
], default-features = false }
k8s-openapi = { version = "0.23", features = ["v1_31"] }

# Git operations (using system git command via std::process::Command)
# No dependencies needed - git must be in PATH

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Terminal UI
indicatif = "0.17"
console = "0.15"
colored = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP client (for health checks) - using rustls instead of OpenSSL
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }

# Time/Duration utilities
humantime = "2.1"

# Base64 encoding/decoding
base64 = "0.22"

# Time utilities
chrono = "0.4"

# URL encoding for Pushgateway
urlencoding = "2.1"

# Cryptographic hashing
sha2 = "0.10"
md5 = "0.7"
blake3 = "1.5"

# Attestation framework (optional — not needed for basic push/release workflows)
tameshi = { version = "0.1", optional = true }

# Binary location utilities
which = "6.0"

# Regular expressions (for bundle verification)
regex = "1.11"

# Glob patterns (for migration file exclusion)
glob = "0.3"

# TOML parsing (for seed data files)
toml = "0.8"

# Directory walking (for observability code scanning)
walkdir = "2.5"

# Guard for cleanup on scope exit
scopeguard = "1.2"

# Temp directories (for chart workspace isolation)
tempfile = "3.14"

# UUID for release IDs
uuid = { version = "1.11", features = ["serde"] }

# docker-archive tarball + layer-tar walking (image-release ELF verification)
tar = "0.4"

[features]
default = []
attestation = ["tameshi"]

[dev-dependencies]
# Test utilities
tokio-test = "0.4"

[[bin]]
name = "forge"
path = "src/main.rs"
