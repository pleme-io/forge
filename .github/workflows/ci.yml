# FLAKE EVALUATION GATE — NOT a test gate. Read this before trusting it.
#
# This delegates to substrate's cargo-ci.yml, which runs `nix flake check`.
# substrate's header says that "runs whatever `checks.<system>.*` the flake
# exposes (usually `cargo test` via the substrate baseline)". For this repo
# BOTH halves of that sentence are false: flake.nix declares no `checks`
# output, and the named substrate baseline does not exist either
# (`lib/build/rust/library.nix` returns `{ packages, devShells, apps }`;
# `lib/build/rust/lockfile-builder.nix` never mentions `runTests`).
#
# Consequence, measured on this repo: `nix flake check` reports every output
# as "(build skipped)" and exits 0 even with `compile_error!` in a test
# module — and even with literal non-Rust garbage in cli/src. It compiles
# nothing. It is a pure evaluation check.
#
# That is still worth having: flake eval breakage is exactly what kept this
# workflow red from 2026-07-17 until 3b58cfa, and the comments below record
# how that was fixed. It is simply not evidence that any code compiles or
# that any test passes.
#
# THE TESTS LIVE IN `.github/workflows/tests.yml` — `cargo test
# --all-targets --all-features --locked` over 2,950 test attributes, with
# the red-run receipts that prove it is non-vacuous. Do not read a green
# `ci` as a green test suite.

name: ci
on: [push, pull_request]
jobs:
  check:
    uses: pleme-io/substrate/.github/workflows/cargo-ci.yml@main
    with:
      # --impure is required because this flake exposes a devenv devShell.
      #
      # `nix flake check` evaluates EVERY output, including devShells, and a
      # devenv shell cannot be evaluated purely — it needs the working
      # directory, so a pure eval aborts with:
      #   error: Failed assertions:
      #   - devenv was not able to determine the current directory.
      #
      # Still true after the 2026-07-28 devShell split, but the shell it now
      # applies to is `devShells.devenv`, NOT `default`. `nix flake check`
      # evaluates EVERY devShell, so one devenv-backed shell anywhere in the
      # flake keeps this leg impure even though `.#default` is now a plain
      # substrate `mkRustDevShell` that evaluates purely on all 3 systems
      # (verified: `nix eval .#devShells.<sys>.default.drvPath`, no --impure,
      # green for aarch64-darwin / x86_64-linux / aarch64-linux).
      #
      # Scope of the weakening is narrow and worth naming: it applies to the
      # EVALUATION of this repo's flake outputs in CI. The checks themselves
      # are still sandboxed nix builds. It does NOT make other repos impure —
      # cargo-ci defaults flake-args to "" and the other callers are
      # unaffected.
      flake-args: "--impure"

      # The cargo-test leg needs this, and the reason is structural rather
      # than stylistic: substrate's default is `--workspace`, which it runs
      # from the repo ROOT, and forge has NO root Cargo.toml. `cli/` and
      # `provision/*` are independent crates, not workspace members — so the
      # default command fails before compiling anything:
      #   error: could not find `Cargo.toml` in `/…/forge` or any parent
      #          directory
      # Measured inside the fixed devShell 2026-07-28. That is a SECOND,
      # independent blocker from the devShell one — entering `.#default`
      # successfully is necessary but not sufficient for this leg to pass.
      #
      # `--manifest-path cli/Cargo.toml` points it at the crate that is
      # actually forge; `--all-targets --all-features` mirrors tests.yml,
      # where both flags are measured, not decorative (`--all-targets` is
      # what compiles the test target at all; `--all-features` is worth 263
      # tests gated behind the optional `attestation` feature).
      #
      # NOTE this covers `cli` only. `provision/forge-provision` is still
      # covered by tests.yml's matrix; a single `cargo test` invocation
      # cannot span two unrelated crate roots. Making that unnecessary means
      # giving forge a real root workspace, which is a structural change to
      # the gen-cargo sidecars and deliberately not bundled into a devShell
      # fix.
      test-args: "--manifest-path cli/Cargo.toml --all-targets --all-features --no-fail-fast"
